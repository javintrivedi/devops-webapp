name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Display Message
      run: echo "Build Successful!"

    - name: List Files
      run: ls -la
      
    - name: Notify Slack
      if: always()
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{"text":"GitHub CI Pipeline Completed ✅"}' \
        ${{ secrets.SLACK_WEBHOOK_URL }}
